name: 기능 제안
description: 새 기능이나 개선 아이디어
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
  - type: checkboxes
